name: Ansible Roles
description: >-
  A curated collection of APIs and resources for discovering, managing, and
  consuming Ansible roles — the primary unit of reusable automation content in
  the Ansible ecosystem. Covers the Galaxy and Automation Hub APIs for role
  discovery, download, and publishing, as well as the Ansible Collections
  framework that has extended the role model into full-featured content packages.
