  - type: Features
    data:
      - name: Role Search and Discovery
        description: >-
          Search Galaxy for community-contributed roles by keyword, author,
          namespace, or tag to find reusable automation content.
      - name: Collection Packaging
        description: >-
          Bundle roles, modules, plugins, and documentation into distributable
          collection packages versioned and published via the Galaxy API.
      - name: Version Management
        description: >-
          Access specific versions of roles and collections, enabling
          pinned dependency management in Ansible projects.
      - name: Certified Content
        description: >-
          Access Red Hat-certified and partner-validated Ansible collections
          with enterprise-grade quality assurance via Automation Hub.
      - name: Namespace Management
        description: >-
          Manage author namespaces on Galaxy to publish and maintain role
          and collection content under a consistent identity.
  - type: UseCases
    data:
      - name: Role Reuse Across Projects
        description: >-
          Discover and install community roles from Galaxy to avoid
          reinventing automation logic for common tasks like nginx, MySQL,
          or Kubernetes setup.
      - name: Certified Enterprise Automation
        description: >-
          Use Red Hat-certified collections from Automation Hub in production
          environments where quality assurance and support are required.
      - name: Private Content Distribution
        description: >-
          Publish internal roles and collections to a private Automation Hub
          instance for controlled distribution within an organization.
      - name: Dependency Management
        description: >-
          Pin role and collection versions in requirements.yml files and
          install them via the Galaxy API in CI/CD pipelines.
  - type: Integrations
    data:
      - name: Ansible Playbooks
        description: >-
          Use roles discovered via the Galaxy API directly in Ansible playbooks
          with the roles directive or include_role task.
      - name: Ansible Automation Platform
        description: >-
          Synchronize collections from Galaxy or Automation Hub into
          Ansible Automation Platform for use in job templates.
      - name: Requirements Files
        description: >-
          Define role and collection dependencies in requirements.yml and
          install them automatically via ansible-galaxy CLI using the API.
